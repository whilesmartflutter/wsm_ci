# Reusable staging distribution: iOS -> TestFlight, Android -> Firebase App
# Distribution. Callers own the trigger; see README.md for the stub.
name: Staging Distribution (reusable)

on:
  workflow_call:
    inputs:
      platforms:
        description: 'android | ios | both'
        required: true
        type: string
      release_notes:
        required: true
        type: string
      flavor:
        required: false
        default: 'staging'
        type: string
      flutter_version:
        required: false
        default: '3.41.9'
        type: string
      flutter_channel:
        required: false
        default: 'stable'
        type: string
      xcode_version:
        required: false
        default: '26'
        type: string
      java_version:
        required: false
        default: '17'
        type: string
      ruby_version:
        required: false
        default: '3.2.2'
        type: string

    secrets:
      ASC_KEY_ID: { required: false }
      ASC_ISSUER_ID: { required: false }
      ASC_KEY_P8_BASE64: { required: false }
      APPLE_TEAM_ID: { required: false }
      MATCH_PASSWORD: { required: false }
      MATCH_GIT_DEPLOY_KEY: { required: false }
      ANDROID_KEYSTORE_BASE64: { required: false }
      ANDROID_KEYSTORE_PASSWORD: { required: false }
      ANDROID_KEY_PASSWORD: { required: false }
      FIREBASE_SERVICE_ACCOUNT_JSON: { required: false }
      FIREBASE_APP_ID_ANDROID_STAGING: { required: false }

jobs:
  android:
    runs-on: ubuntu-latest
    if: contains(inputs.platforms, 'android') || inputs.platforms == 'both'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: android/fastlane

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: ${{ inputs.java_version }}

      - name: Setup Firebase credentials
        env:
          FIREBASE_SERVICE_ACCOUNT_JSON: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_JSON }}
        run: printf '%s' "$FIREBASE_SERVICE_ACCOUNT_JSON" > firebase_service_account.json

      - name: Setup Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ vars.ANDROID_KEY_ALIAS }}
        run: |
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/key.jks
          # PKCS12 — the default keystore format since Java 9 — has no
          # per-key password: keytool refuses `-keypasswd` on one entirely.
          # So ANDROID_KEY_PASSWORD is optional and falls back to the store
          # password. `:-` covers both unset and empty, and GitHub sets an
          # undefined secret to an empty string.
          KEY_PASSWORD="${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}"
          cat <<EOP > android/key.properties
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=key.jks
          EOP

      - name: Generate code
        run: |
          if grep -qE '^  build_runner:' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner is not a dependency; skipping code generation."
          fi

      - name: Install Fastlane gems
        working-directory: android/fastlane
        run: bundle install

      - name: Distribute to Firebase App Distribution
        working-directory: android/fastlane
        run: bundle exec fastlane release_firebase_app_distribution release_notes:"${{ inputs.release_notes }}"
        env:
          FIREBASE_APP_ID_ANDROID_STAGING: ${{ secrets.FIREBASE_APP_ID_ANDROID_STAGING }}
          APP_PACKAGE_NAME: ${{ vars.APP_PACKAGE_NAME }}

  ios:
    runs-on: macos-latest
    if: contains(inputs.platforms, 'ios') || inputs.platforms == 'both'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ inputs.flutter_version }}
          channel: ${{ inputs.flutter_channel }}
          cache: true

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ inputs.ruby_version }}
          bundler-cache: true
          working-directory: ios/fastlane

      - name: Generate code
        run: |
          if grep -qE '^  build_runner:' pubspec.yaml; then
            dart run build_runner build --delete-conflicting-outputs
          else
            echo "build_runner is not a dependency; skipping code generation."
          fi

      - name: Install FlutterFire CLI
        run: |
          # An app configured with `flutterfire configure` gets Xcode run-script
          # phases that shell out to the flutterfire CLI (bundle-service-file,
          # upload-crashlytics-symbols). Without it on PATH the archive fails
          # with PhaseScriptExecution, several screens away from the cause.
          if grep -qE '^  firebase_core:' pubspec.yaml; then
            dart pub global activate flutterfire_cli
            echo "$HOME/.pub-cache/bin" >> "$GITHUB_PATH"
          else
            echo "firebase_core is not a dependency; skipping FlutterFire CLI."
          fi

      - name: Install Fastlane gems
        working-directory: ios/fastlane
        run: bundle install

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Setup SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MATCH_GIT_DEPLOY_KEY }}

      - name: Distribute to TestFlight (staging)
        working-directory: ios/fastlane
        run: bundle exec fastlane release_testflight_staging release_notes:"${{ inputs.release_notes }}"
        env:
          MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APP_BUNDLE_ID: ${{ vars.APP_BUNDLE_ID }}
          APP_BUNDLE_ID_STAGING: ${{ vars.APP_BUNDLE_ID_STAGING }}
